<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title description">
  <title id="title">Abeshek B</title>
  <desc id="description">A subtle animated star field with a shooting star revealing the name Abeshek B.</desc>
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d2a8ff" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#d2a8ff" stop-opacity="0.82"/>
      <stop offset="0.28" stop-color="#58a6ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1000" height="230" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="230" fill="#0d1117"/>
    <path d="M0 184H1000M0 46H1000" stroke="#21262d" stroke-opacity="0.56"/>

    <g fill="#8b949e">
      <circle cx="32" cy="33" r="1" opacity=".46"><animate attributeName="opacity" values=".16;.72;.16" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="74" cy="172" r="1.2" opacity=".38"><animate attributeName="opacity" values=".12;.68;.12" dur="4.2s" begin="-1.2s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="84" r=".9" opacity=".5"><animate attributeName="opacity" values=".2;.74;.2" dur="3.7s" begin="-.8s" repeatCount="indefinite"/></circle>
      <circle cx="168" cy="198" r="1" opacity=".42"><animate attributeName="opacity" values=".12;.72;.12" dur="4.4s" begin="-2.1s" repeatCount="indefinite"/></circle>
      <circle cx="212" cy="27" r="1.2" opacity=".46"><animate attributeName="opacity" values=".15;.76;.15" dur="3.3s" begin="-1.6s" repeatCount="indefinite"/></circle>
      <circle cx="257" cy="143" r=".9" opacity=".4"><animate attributeName="opacity" values=".1;.72;.1" dur="4.7s" begin="-.4s" repeatCount="indefinite"/></circle>
      <circle cx="302" cy="63" r="1" opacity=".54"><animate attributeName="opacity" values=".18;.78;.18" dur="3.8s" begin="-2.3s" repeatCount="indefinite"/></circle>
      <circle cx="346" cy="203" r="1.2" opacity=".36"><animate attributeName="opacity" values=".1;.66;.1" dur="4.1s" begin="-1.5s" repeatCount="indefinite"/></circle>
      <circle cx="397" cy="29" r=".9" opacity=".42"><animate attributeName="opacity" values=".12;.7;.12" dur="4.5s" begin="-.7s" repeatCount="indefinite"/></circle>
      <circle cx="452" cy="166" r="1" opacity=".48"><animate attributeName="opacity" values=".16;.72;.16" dur="3.5s" begin="-2.8s" repeatCount="indefinite"/></circle>
      <circle cx="504" cy="19" r="1.1" opacity=".44"><animate attributeName="opacity" values=".12;.74;.12" dur="4s" begin="-1s" repeatCount="indefinite"/></circle>
      <circle cx="555" cy="202" r=".9" opacity=".52"><animate attributeName="opacity" values=".18;.76;.18" dur="3.6s" begin="-1.9s" repeatCount="indefinite"/></circle>
      <circle cx="604" cy="69" r="1.2" opacity=".4"><animate attributeName="opacity" values=".12;.68;.12" dur="4.8s" begin="-.6s" repeatCount="indefinite"/></circle>
      <circle cx="650" cy="156" r=".8" opacity=".46"><animate attributeName="opacity" values=".14;.72;.14" dur="3.9s" begin="-2.4s" repeatCount="indefinite"/></circle>
      <circle cx="694" cy="34" r="1" opacity=".5"><animate attributeName="opacity" values=".15;.76;.15" dur="4.3s" begin="-1.7s" repeatCount="indefinite"/></circle>
      <circle cx="739" cy="202" r="1.2" opacity=".42"><animate attributeName="opacity" values=".1;.7;.1" dur="3.4s" begin="-1.4s" repeatCount="indefinite"/></circle>
      <circle cx="786" cy="94" r=".9" opacity=".48"><animate attributeName="opacity" values=".16;.76;.16" dur="4.6s" begin="-.9s" repeatCount="indefinite"/></circle>
      <circle cx="833" cy="21" r="1.1" opacity=".38"><animate attributeName="opacity" values=".12;.68;.12" dur="3.8s" begin="-2.5s" repeatCount="indefinite"/></circle>
      <circle cx="882" cy="178" r=".9" opacity=".5"><animate attributeName="opacity" values=".16;.76;.16" dur="4.2s" begin="-1.1s" repeatCount="indefinite"/></circle>
      <circle cx="925" cy="58" r="1.2" opacity=".44"><animate attributeName="opacity" values=".12;.72;.12" dur="3.6s" begin="-2s" repeatCount="indefinite"/></circle>
      <circle cx="969" cy="145" r="1" opacity=".48"><animate attributeName="opacity" values=".15;.76;.15" dur="4.5s" begin="-.5s" repeatCount="indefinite"/></circle>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;.7;1" dur="1.2s" begin="1.65s" fill="freeze"/>
      <text x="500" y="127" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing=".4">Abeshek B</text>
      <text x="500" y="154" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="3">BUILDING WHAT'S NEXT</text>
    </g>

    <g filter="url(#soft-glow)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="-250 -46" to="1250 252" dur="1.85s" begin=".15s" fill="freeze"/>
        <path d="M-190 0H0" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="24" fill="url(#glow)"/>
        <circle cx="0" cy="0" r="2.5" fill="#f0f6fc"/>
